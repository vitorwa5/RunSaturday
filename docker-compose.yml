# Local development database only. Do not use these credentials in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: runsaturday
      POSTGRES_PASSWORD: runsaturday
      POSTGRES_DB: runsaturday
    ports:
      - "5432:5432"
    volumes:
      - runsaturday-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runsaturday"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  runsaturday-db:
